apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    run: djangoserver
  name: djangoserver
spec:
  replicas: 1
  selector:
    matchLabels:
      run: djangoserver
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        run: djangoserver
    spec:
      containers:
      - image: us.icr.io/sn-labs-u241983/djangoserver:1
        imagePullPolicy: Always
        name: djangoserver
        env:
        - name: PHOTOS_URL
          value: https://pictures.2h1ovetn7o3d.us-south.codeengine.appdomain.cloud
        - name: SONGS_URL
          value: http://songs-sn-labs-u241983.labs-prod-openshift-san-a45631dc5778dc6371c67d206ba9ae5c-0000.us-east.containers.appdomain.cloud
        ports:
        - containerPort: 8000
          protocol: TCP
      restartPolicy: Always
